services:
  app:
    build: .
    container_name: project_name-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_DATABASE: project_name
      DB_USERNAME: project_name
      DB_PASSWORD: secret
      REDIS_HOST: redis
      APP_ENV: local
      APP_URL: http://project_name.localhost
    networks:
      - project_name-network
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: ["bash", "docker-entrypoint.sh", "php-fpm"]

  webserver:
    image: nginx:alpine
    container_name: project_name-web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - project_name-network

  db:
    image: postgres:15
    container_name: project_name-postgres
    environment:
      POSTGRES_DB: project_name
      POSTGRES_USER: project_name
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project_name-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_name"]
      interval: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: project_name-redis
    networks:
      - project_name-network

  vite:
    build:
      context: .
      target: vite-builder
    container_name: project_name-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    tty: true
    stdin_open: true
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - project_name-network

networks:
  project_name-network:
    driver: bridge

volumes:
  postgres_data:
  node_modules_data:
