services:
  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: fullbaydemo-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_DATABASE: fullbaydemo
      DB_USERNAME: fullbaydemo
      DB_PASSWORD: secret
      REDIS_HOST: redis
      APP_ENV: local
      APP_URL: http://fullbaydemo.localhost
    networks:
      - fullbaydemo-network
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: ["bash", "docker-entrypoint.sh", "php-fpm"]

  webserver:
    image: nginx:alpine
    container_name: fullbaydemo-web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - fullbaydemo-network

  db:
    image: postgres:15
    container_name: fullbaydemo-postgres
    environment:
      POSTGRES_DB: fullbaydemo
      POSTGRES_USER: fullbaydemo
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fullbaydemo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullbaydemo"]
      interval: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: fullbaydemo-redis
    networks:
      - fullbaydemo-network

  vite:
    build:
      context: .
      target: vite-builder
    container_name: fullbaydemo-vite
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    tty: true
    stdin_open: true
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - fullbaydemo-network

networks:
  fullbaydemo-network:
    driver: bridge

volumes:
  postgres_data:
  node_modules_data:
